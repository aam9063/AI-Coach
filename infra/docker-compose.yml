# Local infrastructure for tri-coach (PROJECT_BRIEF.md §12.1, task SC-6).
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml down -v
#
# Secrets (§14): copy .env.example to .env at the REPO ROOT. The root .env is
# loaded into api/worker/beat via `env_file` (optional: a bare `up` without a
# .env still works using the inert defaults in app/core/settings.py). The
# service-to-service URLs below always point at the compose network hosts,
# overriding whatever a developer's root .env says about localhost.

name: tri-coach

x-backend-env: &backend-env
  # Inside the compose network postgres/redis are reachable by service name.
  DATABASE_URL: postgresql+asyncpg://tri_coach:${POSTGRES_PASSWORD:-tri_coach}@postgres:5432/tri_coach
  REDIS_URL: redis://redis:6379/0

x-backend: &backend
  build: ../backend
  env_file:
    - path: ../.env
      required: false
  environment: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    # PostgreSQL 16 WITH the pgvector extension (§6; evidence store, §8).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tri_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tri_coach}
      POSTGRES_DB: tri_coach
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tri_coach -d tri_coach"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.scheduler.celery_app:celery_app worker --loglevel=INFO

  beat:
    <<: *backend
    # Placeholder schedule file in /tmp: the beat container runs as a
    # non-root user with a read-only /app. Real beat jobs arrive with
    # Feature scheduled-messages (§11).
    command: celery -A app.scheduler.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/tri-coach-celerybeat-schedule

volumes:
  postgres-data:
