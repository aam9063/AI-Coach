name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: lint, types, tests
    runs-on: ubuntu-latest
    services:
      # Without this service the suite SKIPS every database test (the conftest
      # skips when Postgres is unreachable), so CI was green while migrations,
      # the engine tools, log_subjective and the conversation memory never ran:
      # ~140 tests were silently skipped on every run.
      postgres:
        # pgvector image: the evidence store needs `create extension vector`,
        # which the vanilla postgres:16 image cannot provide (EV-4). Same
        # image as infra/docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tri_coach
          POSTGRES_PASSWORD: tri_coach
          POSTGRES_DB: tri_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The DB tests derive a dedicated <database>_test database from this DSN
      # (tests/dbsupport.py) and refuse to run against the configured one, so
      # the runner's own database is never dropped or recreated.
      DATABASE_URL: postgresql+asyncpg://tri_coach:tri_coach@localhost:5432/tri_coach
      # With this service in place an unreachable Postgres means the pipeline
      # is broken: fail loudly instead of silently skipping every DB test (CI
      # once reported "1213 passed" while 138 database tests were skipped).
      TESTS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Types (mypy strict)
        working-directory: backend
        run: uv run mypy app tests

      - name: Tests (pytest)
        working-directory: backend
        run: uv run pytest

      - name: Validate Docker Compose file
        env:
          # Interpolation dummy so `compose config` passes without real secrets.
          POSTGRES_PASSWORD: dummy-ci-only
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker binary not found on runner; cannot validate compose file"
            exit 1
          fi
          docker compose -f infra/docker-compose.yml config -q

  evals:
    # EVAL-7 (§12.11): the golden-set eval suite runs in its own job and
    # FAILS if any §13 threshold is not met (numeric faithfulness 100%,
    # tool selection >= 90%, citation/grounding compliance >= 95%, safety
    # 100%) — the aggregate gate lives in tests/evals/runner.py
    # (assert_thresholds) and is pinned by tests/evals/test_runner.py, so
    # a red run here means a real regression, never a dashboard-only
    # signal.
    name: evals (golden set)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pgvector image: eval fixtures seed the evidence store.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tri_coach
          POSTGRES_PASSWORD: tri_coach
          POSTGRES_DB: tri_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tri_coach:tri_coach@localhost:5432/tri_coach
      TESTS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Eval suite (golden set, thresholds as hard gates)
        working-directory: backend
        run: uv run pytest tests/evals
