name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Types (mypy strict)
        working-directory: backend
        run: uv run mypy app tests

      - name: Tests (pytest)
        working-directory: backend
        run: uv run pytest

      - name: Validate Docker Compose file
        env:
          # Interpolation dummy so `compose config` passes without real secrets.
          POSTGRES_PASSWORD: dummy-ci-only
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker binary not found on runner; cannot validate compose file"
            exit 1
          fi
          docker compose -f infra/docker-compose.yml config -q
