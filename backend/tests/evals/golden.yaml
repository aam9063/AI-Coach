# --- Workout planner (workout-planner T5) -----------------------------------
#
# One case per decision-table row of app/engine/planner.py, so the §13 gates
# cover the planner exactly like every other tool. The composer branch for
# plan_workout (tests/evals/runner.py) quotes the engine's reason, kind,
# sport, zones and duration VERBATIM from the tool output, so each branch is
# gated by its expected engine numbers plus forbidden_content markers that
# would be an INVENTION in that branch — a tool that picked the wrong row
# makes the composer quote the wrong session and fails the gate. Every case
# scripts day=2026-09-07 (the fixture anchor date) because plan_workout with
# day=None resolves to the REAL current date, which would be
# non-deterministic against the fixed fixtures.

- id: planner-recovery-en
  # Row 1: readiness.suggest_reduce_intensity is true -> recovery, Z1-Z2,
  # duration capped at 60 min. The 3600 s cap is asserted against the value
  # the tool REALLY returns (session.duration_s, quoted by the composer), not
  # the number we wish it returned. A tool that wrongly answered rest or
  # quality would drop the cap from the reply and fail the expected value.
  category: readiness
  user_message: "What can I train today? I feel heavy."
  db_fixture: planner_recovery
  expected_tool_calls:
    - name: plan_workout
      input: {day: "2026-09-07"}
  expected_numeric_values:
    - {value: 3600.0, tolerance: 0.5, description: "engine planner RECOVERY_MAX_DURATION_S: the recovery cap plan_workout returns"}
  citation_required: false
  forbidden_content: ["descanso"]

- id: planner-rest-en
  # Row 2: TSB strictly below the very-negative threshold (-10.0, reused from
  # readiness) -> rest or mobility. A rest prescription expresses NO
  # intensity and NO workload, so the forbidden markers below are exactly
  # what would be an invention in this branch: any zone key or any duration
  # (the 3600 s cap included) must not reach the athlete.
