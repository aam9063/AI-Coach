# Golden set for the eval suite (EVAL-2, PROJECT_BRIEF section 13).
#
# Every case carries EXACTLY the section-13 fields (see tests/evals/golden.py):
#   id, category, user_message, db_fixture, expected_tool_calls,
#   expected_numeric_values, citation_required, forbidden_content.
#
# NUMERIC PROVENANCE (section 13: expectations come FROM THE ENGINE, never
# hand-invented). Each expected value below was produced by the engine or
# copied from a verified test anchor:
#
# - load cases: app.engine.pmc.compute_pmc over the load_window fixture's
#   fixed TSS series (2026-06-01..2026-09-07, weekly pattern
#   [60, 0, 45, 70, 0, 90, 30] Mon..Sun; per-sport split ride 60% / run 40%),
#   evaluated on 2026-09-07:
#   combined ctl 38.7085..., atl 45.3200..., tsb -4.8702..., tss 60.0;
#   ride ctl 23.2251... (computed with the same function the fixture uses).
# - zones cases: the pure engine at query time from the fixture thresholds:
#   app.engine.zones.power_zones(210.0) -> Z2 115.5..159.6 W;
#   app.engine.zones.hr_zones("run", 169.0) -> Z2 143.65..152.1 bpm;
#   app.engine.zones.swim_zones(0.8333333) -> Z2 126.3158..141.1765 s/100m
#   (anchor: tests/engine/test_zones_*.py).
# - readiness cases: engine-shaped ReadinessSnapshotRow anchored on
#   tests/agent/test_agent_tools.py::make_readiness_snapshot (HRV observed
#   4.17 vs baseline 4.1, tsb -12.0, agreement_count 1; the warning variant
#   raises agreement_count to 2 with suggest_reduce_intensity=true).
# - activity cases: SessionDurabilityRow anchored on
#   tests/agent/test_agent_tools.py (ef 0.98/0.95, decoupling 0.031 -> 3.1%).
# - prediction cases: app.engine.predict.triathlon_total_prediction with the
#   eval athlete inputs (ftp 250 W, css 0.8333333 m/s, threshold run speed
#   3.33 m/s, 70 kg; standard flat course, ISA defaults), total envelope
#   point: olympic 9555.4671... s, sprint 4715.3879... s (anchor:
#   tests/agent/test_predict_race.py engine_reference).
# - plot cases: chart_id 1 (fresh schema per case) and coverage
#   samples_in_chart 7 (one daily_load / wellness row per day of the window).
# - intensity cases: WeeklyIntensityRow percentages 75/15/10 anchored on
#   tests/agent/test_plot_metric.py::make_weekly_intensity.
# - subjective case: the tool echoes the recorded rpe 6 / fatigue 4.
# - propose case: the tool echoes the proposed 220.0 W.
#
# Tolerances cover the reply's 2-decimal rounding of the quoted values.
