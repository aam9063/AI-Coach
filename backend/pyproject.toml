[project]
name = "tri-coach"
version = "0.1.0"
description = "Triathlon coaching assistant: deterministic engine, WhatsApp agent, evidence store."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "fitdecode>=0.10",
    "httpx>=0.27",
    "twilio>=9.0",
    "langfuse>=2.50",
    "pgvector>=0.3",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
# Resolve app/ packages unambiguously from the project root.
explicit_package_bases = true

[[tool.mypy.overrides]]
# fitdecode ships no py.typed marker (as of 0.11); untyped for mypy.
module = "fitdecode.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no py.typed marker (as of 5.x); untyped for mypy.
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
